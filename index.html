function startDrop(){
  var lives=3,n=0,total=12,hits=0,cu=null,last=0,speed=34;
  stage.innerHTML='<section class="card"><div class="head"><span class="lives" id="lv"></span><span class="note" id="cnt"></span></div>'+
  '<div class="well" id="well" aria-live="polite"></div>'+
  '<div class="dz-btns"><button class="sbtn s2" id="b2">SHAPE 2<span>past simple</span></button><button class="sbtn s3" id="b3">SHAPE 3<span>have / has + verb</span></button></div>'+
  '<div id="fb"></div></section>';
  var well=$('#well');dropRun=true;
  function hearts(){$('#lv').textContent='♥ '.repeat(lives)+'♡ '.repeat(3-lives);$('#cnt').textContent='Piece '+Math.min(n,total)+' of '+total}
  var cols=[MCOL.I,MCOL.O,MCOL.T,MCOL.S,MCOL.J,MCOL.L];
  function spawn(){
    if(n>=total||lives<=0){end();return}
    n++;hearts();
    var t=DROP[Math.floor(Math.random()*DROP.length)],form=Math.random()<.5?2:3;
    var el=document.createElement('div');el.className='piece blk';el.style.setProperty('--bc',cols[Math.floor(Math.random()*cols.length)]);
    el.innerHTML='<small>'+esc(t[0])+'</small><b>'+esc(t[form-1])+'</b>';
    el.style.left=(18+Math.random()*64)+'%';el.style.top='0px';well.appendChild(el);
    cu={t:t,form:form,y:0,el:el,wrongLogged:false};
  }
  function ans(f){
    if(!cu||!dropRun)return;
    if(f===cu.form){hits++;win(1);var e=cu.el;e.classList.add('pop');cu=null;$('#fb').innerHTML='';setTimeout(function(){e.remove();spawn()},300)}
    else{
      if(!cu.wrongLogged){cu.wrongLogged=true;S.log.shape.push({item:'Drop Zone: '+cu.t[0]+' / '+cu.t[cu.form-1],chose:f,need:cu.form});save()}
      cu.el.classList.remove('shake');void cu.el.offsetWidth;cu.el.classList.add('shake');
      $('#fb').innerHTML=msg('no','Not that side. Past time word (yesterday, ago) = Shape 2. Helper (have, has) = Shape 3.');
    }
  }
  function miss(){
    var e=cu.el,t=cu.t,f=cu.form;lives--;cu=null;e.remove();hearts();
    S.log.shape.push({item:'Drop Zone missed: '+t[0]+' / '+t[f-1],chose:0,need:f});save();
    $('#fb').innerHTML=msg('info','Too slow! <b>'+esc(t[f-1])+'</b> is Shape '+f+' of <b>'+esc(t[0])+'</b> ('+esc(t[0])+', '+esc(t[1])+', '+esc(t[2])+').');
    spawn();
  }
  function tick(ts){
    if(!dropRun)return;
    if(!last)last=ts;var dt=Math.min(.05,(ts-last)/1000);last=ts;
    if(cu){cu.y+=speed*dt;cu.el.style.top=cu.y+'px';if(cu.y>well.clientHeight-cu.el.offsetHeight)miss()}
    raf=requestAnimationFrame(tick);
  }
  function end(){
    dropRun=false;cancelAnimationFrame(raf);
    stage.innerHTML='<section class="card"><h2>'+(lives>0?'ROUND CLEAR!':'GAME OVER')+'</h2><p class="big" style="margin:14px 0">'+hits+' of '+total+' pieces placed.</p>'+
    '<div class="row"><button class="btn alt" id="again">PLAY AGAIN</button><button class="btn" data-go="4">NEXT: DESCRIBE IT</button></div></section>';
    $('#again').onclick=startDrop;bindGo();
  }
  $('#b2').onclick=function(){ans(2)};$('#b3').onclick=function(){ans(3)};
  keyH=function(e){if(e.key==='2'||e.key==='ArrowLeft')ans(2);else if(e.key==='3'||e.key==='ArrowRight')ans(3)};
  document.addEventListener('keydown',keyH);
  spawn();raf=requestAnimationFrame(tick);
}

/* ---------- sentence checker ---------- */
var ALLW=FACT.map(function(f){return f[1]}).concat(EXTRA_DESC);
var PAST=(function(){var s={};VERBS.reg.concat(VERBS.irr,DROP).forEach(function(v){s[v[1]]=1});
  ['was','were','had','did','said','got','made','felt','met','ran','won','sat','read','came','knew','told','found','left','heard','kept','lost','sold','sent','thought','played','visited','watched'].forEach(function(w){s[w]=1});return s})();
var NOTED=['need','speed','bed','red','feed','seed','weed','indeed','hundred','shed','sled'];
var SUBJ=['i',"i'm","i'd",'we','he','she','they','it','you','my','our','his','her','their','mum','dad','everyone'];
function sentCheck(txt,r){
  var t=txt.trim(),clean=t.replace(/[.,!?;:]/g,' '),toks=clean.split(/\s+/).filter(Boolean),low=toks.map(function(x){return x.toLowerCase().replace(/[‘’`]/g,"'")});
  var out=[];
  out.push({ok:/^[A-Z]/.test(t),label:'Starts with a capital letter'});
  out.push({ok:/[.!?]$/.test(t),label:'Ends with . ! or ?'});
  out.push({ok:toks.length>=r.min,label:'At least '+r.min+' words ('+toks.length+' now)'});
  var capMid=toks.some(function(w,i){return i>0&&/^[A-Z][a-z]+$/.test(w)&&!/^(Yesterday|Last|Then|After|Before|On|In|At|But|And|So)$/.test(w)});
  out.push({ok:low.length>1&&(low.some(function(w){return SUBJ.indexOf(w)>-1})||capMid),label:'Has a subject (I, we, he, my friend...)'});
  if(r.word)out.push({ok:new RegExp('\\b'+r.word+'\\b','i').test(t),label:'Uses the word "'+r.word+'"'});
  if(r.notEx)out.push({ok:norm(t).replace(/[.!?]$/,'')!==norm(r.notEx).replace(/[.!?]$/,''),label:'Your own idea (not the example)'});
  if(r.past)out.push({ok:low.some(function(w){return PAST[w]||(w.length>3&&/ed$/.test(w)&&NOTED.indexOf(w)<0)}),label:'Uses a past verb (Shape 2)'});
  if(r.vocab)out.push({ok:low.some(function(w){return ALLW.indexOf(w)>-1}),label:'Uses a describing word (amazing, proud, shy...)'});
  if(r.because)out.push({ok:low.indexOf('because')>-1,label:'Explains with because'});
  if(r.sents)out.push({ok:(t.match(/[.!?]/g)||[]).length>=r.sents,label:'Writes '+r.sents+' sentences'});
  return out;
}

      else{inp.classList.add('bad');S.log.spell.push({v1:b[1],form:'word formation',typed:typed,ans:b[2]});$('#bh'+qi).innerHTML=letterHint(typed,b[2])}});
    $('#cB').disabled=true;S.boss.B=ok;save();$('#rB').innerHTML=msg(ok===B.length?'ok':'info','Part B: '+ok+' of '+B.length+'. Green and red letters show your spelling.');
  };
  var opts='<option value="">?</option>'+Cs.map(function(c){return '<option value="'+c[0]+'">'+c[0]+'</option>'}).join('');
  function g(n){return '<select class="inp" id="g'+n+'" aria-label="Gap '+n+'">'+opts+'</select>'}
  $('#txt').innerHTML='<p><b>A Night at the Arcade</b></p>'+
   '<p>Last Friday, Leo went to the arcade with his cousin. (1) '+g(1)+' The room was full of lights and music. They played racing games for an hour. (2) '+g(2)+' Leo wanted to try the old Tetris machine in the corner. (3) '+g(3)+' After ten minutes, he reached level seven, and a small crowd stood behind him. (4) '+g(4)+' He felt proud and a little nervous. In the end, Leo lost the game, but he won a free drink. (5) '+g(5)+' He wanted to go back the next weekend.</p>';
  $('#cC').onclick=function(){
    var ok=0;CA.forEach(function(a,n){var s=$('#g'+(n+1));
      if(s.value===a){ok++;win(2);s.classList.add('good')}else{s.classList.add('bad');S.log.mc.push({item:'Boss C gap '+(n+1),typed:s.value||'(no answer)',ans:a})}});
    $('#cC').disabled=true;S.boss.C=ok;save();
    $('#rC').innerHTML=msg(ok===5?'ok':'info','Part C: '+ok+' of 5. Answers: 1 '+CA[0]+', 2 '+CA[1]+', 3 '+CA[2]+', 4 '+CA[3]+', 5 '+CA[4]+'. Clue words like "After that", "At first" and "It was" help you decide.');
  };
  $('#dq').innerHTML=D.map(function(d,qi){return '<div class="qitem"><p style="margin:4px 0"><b>'+(qi+1)+'.</b> '+esc(d.ro)+'</p><textarea class="ta" id="d'+qi+'" style="min-height:70px" aria-label="Translation '+(qi+1)+'"></textarea><div id="dh'+qi+'"></div></div>'}).join('');
  D.forEach(function(d,qi){noAssist($('#d'+qi))});
  $('#cD').onclick=function(){
    var tot=0;
    D.forEach(function(d,qi){var txt=norm($('#d'+qi).value).replace(/[.,!?]/g,'');
      var found=d.keys.filter(function(alts){return alts.some(function(a){return txt.indexOf(a)>-1})}).length;
      if(found===d.keys.length){tot++;win(2)}
      S.sent['Translation '+(qi+1)]=$('#d'+qi).value.trim();
      $('#dh'+qi).innerHTML=msg(found===d.keys.length?'ok':'info','Key ideas found: '+found+' of '+d.keys.length+'. Model: <b>'+esc(d.model)+'</b>')});
    $('#cD').disabled=true;S.boss.D=tot;save();$('#rD').innerHTML=msg('info','Your teacher will read your sentences too. Check the verb shape and the spelling against the model.');
  };
  var wr=$('#wr');noAssist(wr);if(S.sent['Boss writing'])wr.value=S.sent['Boss writing'];
  function wcheck(){
    var t=wr.value,low=t.toLowerCase(),toks=t.trim().split(/\s+/).filter(Boolean);
    var cnt=toks.filter(function(w){var c=w.toLowerCase().replace(/[^a-z]/g,'');return PAST[c]&&!/ed$/.test(c)}).length;
    $('#wc').textContent=toks.length+' words (goal: 50 to 80)';
    var res=[{ok:toks.length>=50,label:'50 words or more'},{ok:low.indexOf('in the morning')>-1,label:'in the morning'},{ok:low.indexOf('after school')>-1,label:'after school'},{ok:/\bbecause\b/.test(low),label:'because'},{ok:/\bwithout\b/.test(low),label:'without'},{ok:cnt>=3,label:'3 irregular past verbs ('+cnt+' found)'}];
    $('#wl').innerHTML=lightsHtml(res);return res;
  }
  wr.addEventListener('input',wcheck);wcheck();
  $('#cE').onclick=function(){
    var res=wcheck(),toks=wr.value.trim().split(/\s+/).filter(Boolean);
    if(toks.length<30){$('#rE').innerHTML=msg('info','Write a little more first. Try to reach 50 words.');return}
    S.sent['Boss writing']=wr.value.trim();var ok=res.every(function(x){return x.ok});win(ok?4:2);S.boss.E=ok;save();
    $('#cE').disabled=true;
    $('#rE').innerHTML=msg('ok','Handed in! Before you relax, read it once more. Check: <b>capital letters</b>, <b>full stops</b>, <b>spelling</b>, and <b>Shape 2</b> for finished events.');
  };
  bindGo();
}

/* ---------- LEVEL 7: Speaking ---------- */
function L7(){
  var ti=0;
  stage.innerHTML='<section class="card"><div class="head">'+mino('T',12)+'<h2>LEVEL 7: SPEAKING TICKET</h2></div>'+
  '<p>Olympiad speaking works with <b>tickets</b>: pictures to describe, then questions. Pick a ticket. You get <b>1 minute to think</b>, then <b>90 seconds to speak</b>. Say <b>full sentences</b>, not one-word answers!</p><div class="chips" id="tk"></div></section>'+
  '<section class="card" id="tkc"></section>'+
  '<section class="card"><h3>REAL SPEAKING TICKETS</h3><p class="note">These are official county-stage tickets from higher grades, so use them to see the style, not as a test for you yet.</p><div class="links">'+
  '<a href="https://www.edupedu.ro/bilete-olimpiada-de-limba-engleza-2024-etapa-judeteana-subiectele-de-la-proba-orala-pentru-clasa-a-ix-a-normal-si-bilingv-sau-intensiv-descarca/" target="_blank" rel="noopener">Edupedu: ONLE 2024 speaking tickets, grade 9<span>Opens in a new tab. Pictures plus three tasks per ticket.</span></a>'+
  '<a href="https://cdn.edupedu.ro/wp-content/uploads/2024/03/OJ_9_A_engleza_2024_oral.pdf" target="_blank" rel="noopener">Speaking tickets PDF, grade 9, normal programme<span>Opens the document in a new tab.</span></a></div></section>'+nextCard('NEXT: LISTENING',7);
  $('#tk').innerHTML=TICKETS.map(function(t,i){return '<button class="chip" data-t="'+i+'" aria-pressed="'+(i===0)+'">Ticket '+(i+1)+'</button>'}).join('');
  $$('#tk .chip').forEach(function(c){c.onclick=function(){ti=+c.dataset.t;$$('#tk .chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===c))});draw()}});
  function draw(){
    clearInterval(timer);var T=TICKETS[ti],sv=S.speak[ti]||{};
    $('#tkc').innerHTML='<h3>'+esc(T.title)+'</h3>'+
    '<div class="pics" style="margin-top:12px"><div class="pic" role="img" aria-label="'+esc(T.a[1])+'">'+T.a[0]+'<small>PICTURE A</small></div><div class="pic" role="img" aria-label="'+esc(T.b[1])+'">'+T.b[0]+'<small>PICTURE B</small></div></div>'+
    '<ol style="margin:14px 0;padding-left:22px">'+T.tasks.map(function(t){return '<li style="margin:8px 0;font-weight:600">'+esc(t)+'</li>'}).join('')+'</ol>'+
    '<div class="mini" style="--bc:var(--c3)"><h3>HELP BOX</h3><p>In picture A I can see...<br>The boy is ...ing.<br>In my opinion... because...<br>Last weekend I... (use Shape 2!)<br>It was ... (amazing, boring, crowded...)</p></div>'+
    '<div class="row"><span class="timer" id="tm">--</span><button class="btn" id="tgo">START THINKING (60 s)</button></div><div id="tmsg"></div>'+
    '<h3 style="margin-top:20px">TEACHER SCORES (1 to 5)</h3><div class="rate">'+['Full sentences','Grammar and verb shapes','Vocabulary','Pronunciation and fluency'].map(function(c,i){return '<div><label for="r'+i+'">'+c+'</label><select id="r'+i+'"><option value="">-</option>'+[1,2,3,4,5].map(function(n){return '<option value="'+n+'"'+(sv[c]===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>'}).join('')+'</div>'+
    '<div class="row"><button class="btn alt sm" id="rsv">SAVE SCORES</button><span class="note" id="rsm"></span></div>';
    $('#tgo').onclick=function(){
      var phase=0,left=60;clearInterval(timer);$('#tgo').disabled=true;
      $('#tm').textContent='THINK 60';$('#tmsg').innerHTML=msg('info','Think. Plan what you will say. Make notes in your head.');
      timer=setInterval(function(){
        left--;

          if(phase===0){phase=1;left=90;toast('SPEAK NOW!','info');$('#tmsg').innerHTML=msg('ok','Speak now! Use full sentences and add reasons with because.')}
          else{clearInterval(timer);timer=0;$('#tm').textContent='TIME!';$('#tmsg').innerHTML=msg('info','Time is up. Well done! Your teacher can score you below.');$('#tgo').disabled=false;$('#tgo').textContent='TRY AGAIN';win(3);return}
        }
        $('#tm').textContent=(phase===0?'THINK ':'SPEAK ')+left;
      },1000);
    };
    $('#rsv').onclick=function(){
      var o={};['Full sentences','Grammar and verb shapes','Vocabulary','Pronunciation and fluency'].forEach(function(c,i){var v=+$('#r'+i).value;if(v)o[c]=v});
      S.speak[ti]=o;save();$('#rsm').textContent='Saved.';
    };
  }

/* ---------- LEVEL 8: Listening ---------- */
function speakText(text,rate){
  try{
    var ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance==='undefined')return false;
    ss.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;
    var vs=ss.getVoices(),v=null;for(var i=0;i<vs.length;i++){if(/en-GB/i.test(vs[i].lang)){v=vs[i];break}}
    if(!v)for(var j=0;j<vs.length;j++){if(/^en/i.test(vs[j].lang)){v=vs[j];break}}
    if(v)u.voice=v;ss.speak(u);return true;
  }catch(e){return false}
}
function L8(){
  var plays=0;
  stage.innerHTML='<section class="card"><div class="head">'+mino('L',12)+'<h2>LEVEL 8: LISTENING</h2></div>'+
  '<p>Listen to a short story about a weekend. You can listen <b>two times</b>. Then answer the questions.</p>'+
  '<div class="row"><button class="btn" id="pl">▶ PLAY</button><button class="btn alt" id="sl">PLAY SLOWER</button><button class="btn alt" id="sp">STOP</button><span class="note" id="pc">Played 0 times</span></div>'+
  '<div id="pm"></div></section>'+
  '<section class="card"><h3>PART 1: CHOOSE THE ANSWER</h3><div id="lq"></div><div class="row"><button class="btn" id="lc">CHECK PART 1</button></div><div id="lr"></div></section>'+
  '<section class="card"><h3>PART 2: WRITE THE MISSING WORDS</h3><p class="note">Listen again. Write the verb you hear. Spell it yourself!</p><div class="sl story" id="lg"></div><div class="row"><button class="btn" id="lgc">CHECK PART 2</button></div><div id="lgr"></div></section>'+
  '<section class="card"><h3>REAL LISTENING PRACTICE</h3><p class="note">The voice above is a computer voice. For real exam style audio, try these (they open in a new tab).</p><div class="links">'+
  '<a href="https://learnenglishteens.britishcouncil.org/skills/listening/a2-listening" target="_blank" rel="noopener">British Council LearnEnglish Teens: A2 listening<span>Short audio and tasks at the right level for Theo.</span></a>'+
  '<a href="https://www.cambridgeenglish.org/Images/423014-cambridge-english-young-learners-sample-papers-2018-volume-2.pdf" target="_blank" rel="noopener">Cambridge Young Learners sample papers (Flyers, A2)<span>Official sample papers with a listening part. Check the Cambridge site for the audio files.</span></a></div></section>'+nextCard('SEE MY RESULTS',8);
  function play(r){
    if(plays>=2){$('#pm').innerHTML=msg('info','You listened two times. Now answer from what you remember.');return}
    var ok=speakText(LSCRIPT,r);
    if(!ok){$('#pm').innerHTML=msg('info','This device has no voice. Ask your teacher to read the story aloud.');return}
    plays++;$('#pc').textContent='Played '+plays+' time'+(plays>1?'s':'');$('#pm').innerHTML='';
  }
  $('#pl').onclick=function(){play(0.92)};$('#sl').onclick=function(){play(0.75)};
  $('#sp').onclick=function(){try{window.speechSynthesis.cancel()}catch(e){}};
  $('#lq').innerHTML=LMC.map(function(q,qi){return '<div class="qitem" data-q="'+qi+'"><div>'+(qi+1)+'. '+esc(q[0])+'</div><div class="opts">'+q[1].map(function(o,oi){return '<button class="opt" data-o="'+oi+'">'+esc(o)+'</button>'}).join('')+'</div></div>'}).join('');
  var sel={};
  $$('#lq .qitem').forEach(function(box){var qi=+box.dataset.q;$$('.opt',box).forEach(function(b){b.onclick=function(){if($('#lc').disabled)return;sel[qi]=+b.dataset.o;$$('.opt',box).forEach(function(x){x.classList.remove('sel')});b.classList.add('sel')}})});
  $('#lc').onclick=function(){
    var ok=0;
    LMC.forEach(function(q,qi){var box=$('#lq [data-q="'+qi+'"]'),o=$$('.opt',box);o[q[2]].classList.add('right');
      if(sel[qi]===q[2]){ok++;win(1)}else{if(sel[qi]!==undefined)o[sel[qi]].classList.add('wrong');S.log.mc.push({item:'Listening: '+q[0],typed:sel[qi]!==undefined?q[1][sel[qi]]:'(no answer)',ans:q[1][q[2]]})}});
    $('#lc').disabled=true;S.listen.mc=ok;save();
    $('#lr').innerHTML=msg(ok>=4?'ok':'info','Part 1: '+ok+' of '+LMC.length+'. Numbers like forty and fourteen sound similar, so listen to the stress!')+'<div class="row"><button class="btn alt sm" id="scr">SHOW THE SCRIPT</button></div><div id="sc"></div>';
    $('#scr').onclick=function(){$('#sc').innerHTML='<div class="sl" style="margin-top:10px">'+esc(LSCRIPT)+'</div>'};
  };
  var gaps=[],h='';
  LGAP.forEach(function(row,ri){h+='<p style="margin:6px 0">';row.forEach(function(p,pi){if(pi%2===0)h+=esc(p)+' ';else{h+='<input class="inp inl lg" data-g="'+gaps.length+'" aria-label="Missing word '+(gaps.length+1)+'"> ';gaps.push(p)}});h+='</p>'});
  $('#lg').innerHTML=h;$$('.lg').forEach(noAssist);
  $('#lgc').onclick=function(){
    var ok=0,hs=[];
    gaps.forEach(function(a,n){var inp=$('.lg[data-g="'+n+'"]'),typed=norm(inp.value);
      if(typed===a){ok++;win(2);inp.classList.add('good');inp.readOnly=true}
      else{inp.classList.add('bad');S.log.spell.push({v1:a,form:'listening gap',typed:typed,ans:a});hs.push(typed?letterHint(typed,a):'(empty)')}});
    $('#lgc').disabled=true;S.listen.gap=ok;save();
    $('#lgr').innerHTML=msg(ok===gaps.length?'ok':'info','Part 2: '+ok+' of '+gaps.length+'.'+(ok<gaps.length?' Correct words: '+gaps.join(', ')+'.':''));
  };
  bindGo();
}

/* ---------- report + LEVEL 9 ---------- */
function report(){
  var L=S.log,o=[];
  o.push('VERB BLOCKS report for '+(S.name||'student')+' ('+new Date().toLocaleDateString('en-GB')+')');
  o.push('Score '+S.score+', lines cleared '+S.lines);
  o.push('Boss parts: A '+(S.boss.A!==undefined?S.boss.A+'/8':'not done')+', B '+(S.boss.B!==undefined?S.boss.B+'/4':'not done')+', C '+(S.boss.C!==undefined?S.boss.C+'/5':'not done')+', D '+(S.boss.D!==undefined?S.boss.D+'/4 (teacher to review)':'not done')+', E '+(S.boss.E===undefined?'not done':(S.boss.E?'all requirements met':'some requirements missing')));
  o.push('Listening: part 1 '+(S.listen.mc!==undefined?S.listen.mc+'/5':'not done')+', part 2 '+(S.listen.gap!==undefined?S.listen.gap+'/4':'not done'));
  var sk=Object.keys(S.speak);
  o.push('Speaking scores: '+(sk.length?sk.map(function(k){var v=S.speak[k];return 'ticket '+(+k+1)+' ('+Object.keys(v).map(function(c){return c+' '+v[c]}).join(', ')+')'}).join('; '):'not scored'));
  o.push('');o.push('SPELLING (typed vs correct), '+L.spell.length+' item(s):');
  L.spell.length?L.spell.forEach(function(e){o.push('- '+e.v1+' ['+e.form+']: wrote "'+e.typed+'", correct "'+e.ans+'"')}):o.push('- none');
  o.push('');o.push('WRONG SHAPE CHOICES, '+L.shape.length+' time(s):');
  L.shape.length?L.shape.forEach(function(e){o.push('- '+e.item+(e.chose?' (chose '+e.chose+', needed '+e.need+')':' (needed shape '+e.need+')'))}):o.push('- none');
  o.push('');o.push('OTHER MULTIPLE CHOICE MISTAKES, '+L.mc.length+':');
  L.mc.length?L.mc.forEach(function(e){o.push('- '+e.item+' | chose "'+e.typed+'", correct "'+e.ans+'"')}):o.push('- none');
  o.push('');o.push('SENTENCES AND WRITING:');
  var k=Object.keys(S.sent);k.length?k.forEach(function(x){if(S.sent[x])o.push(x+': '+S.sent[x])}):o.push('- none yet');
  return o.join('\n');
}
function copyBox(id,btn){
  var ta=$(id);
  btn.onclick=function(){
    function fb(){ta.focus();ta.select();toast('SELECTED. COPY IT NOW','info')}
    try{navigator.clipboard.writeText(ta.value).then(function(){toast('COPIED!')},fb)}catch(e){fb()}
  };
}
function L9(){
  var errs=S.log.spell.length+S.log.shape.length+S.log.mc.length,st=errs<=8?3:errs<=22?2:1;
  var counts={};S.log.spell.forEach(function(e){counts[e.v1]=(counts[e.v1]||0)+1});
  var top=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]}).slice(0,3);
  stage.innerHTML='<section class="card"><div class="head">'+mino('I',12)+'<h2>RESULTS</h2></div>'+
  '<p class="stars" aria-label="'+st+' stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</p>'+
  '<p class="big" style="margin:10px 0">'+esc(S.name||'Player')+': '+S.score+' points, '+S.lines+' lines.</p>'+
  '<h3 style="margin-top:14px">MY NEXT GOALS</h3><ul><li>'+(top.length?'Practise the spelling of: <b>'+top.map(esc).join(', ')+'</b>.':'Your spelling was strong. Keep it up!')+'</li>'+
  '<li>Answer in full sentences: subject + verb + one extra detail.</li><li>Use Shape 2 for finished past, and Shape 3 after have or has.</li></ul>'+

  $('#rp').value=report();copyBox('#rp',$('#cp'));bindGo();
}

  '<h3>LIVE REPORT</h3><textarea class="rep" id="trp" readonly aria-label="Live report"></textarea><div class="row"><button class="btn" id="tcp">COPY REPORT</button><button class="btn alt" id="rst">RESET GAME</button></div><div id="rsm"></div></aside>';

    $('#rok').onclick=function(){S=fresh();save();hud();$('#tpanel').hidden=true;$('#tbtn').setAttribute('aria-expanded','false');start()};
